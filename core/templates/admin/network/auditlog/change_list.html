{% extends "admin/change_list.html" %}
{% load i18n admin_urls %}

{% block content %}
<style>
    .server-tabs {
        display: flex;
        border-bottom: 2px solid #e2e8f0;
        margin-bottom: 20px;
    }
    .server-tab {
        padding: 12px 24px;
        cursor: pointer;
        font-weight: 600;
        color: #64748b;
        transition: all 0.3s ease;
        border-bottom: 2px solid transparent;
        margin-bottom: -2px;
        font-family: inherit;
        background: transparent;
        border: none;
        outline: none;
        font-size: 16px;
    }
    .server-tab:hover {
        color: #3b82f6;
    }
    .server-tab.active {
        color: #3b82f6;
        border-bottom-color: #3b82f6;
    }
    .tab-content {
        display: none;
    }
    .tab-content.active {
        display: block;
        animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* Server Stats UI */
    .dashboard-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        margin-bottom: 20px;
    }
    .stat-card {
        background: #ffffff;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        border: 1px solid #f1f5f9;
        display: flex;
        flex-direction: column;
    }
    .stat-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
    }
    .stat-title {
        font-size: 18px;
        font-weight: 700;
        color: #1e293b;
        margin: 0;
    }
    .stat-icon {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        color: #ffffff;
    }
    .icon-cpu { background: linear-gradient(135deg, #3b82f6, #2563eb); }
    .icon-mem { background: linear-gradient(135deg, #10b981, #059669); }
    .icon-disk { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .icon-net { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }

    .progress-wrapper {
        margin-bottom: 12px;
    }
    .progress-info {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        font-weight: 600;
        color: #64748b;
        margin-bottom: 8px;
    }
    .progress-bar-bg {
        width: 100%;
        height: 12px;
        background-color: #e2e8f0;
        border-radius: 999px;
        overflow: hidden;
    }
    .progress-bar-fill {
        height: 100%;
        border-radius: 999px;
        transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .fill-cpu { background: linear-gradient(90deg, #60a5fa, #3b82f6); }
    .fill-mem { background: linear-gradient(90deg, #34d399, #10b981); }
    .fill-disk { background: linear-gradient(90deg, #fbbf24, #f59e0b); }
    
    .net-stats {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .net-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px;
        background: #f8fafc;
        border-radius: 8px;
        border: 1px solid #e2e8f0;
    }
    .net-label {
        font-size: 14px;
        font-weight: 600;
        color: #475569;
    }
    .net-value {
        font-size: 16px;
        font-weight: 700;
        color: #1e293b;
    }
    .disk-item {
        margin-bottom: 16px;
    }
    .disk-item:last-child {
        margin-bottom: 0;
    }
</style>

<div>
    <div class="server-tabs">
        <button class="server-tab active" onclick="switchTab('tab-stats', this)">Server Resources (Live)</button>
        <button class="server-tab" onclick="switchTab('tab-logs', this)">Audit Logs</button>
    </div>

    <div id="tab-stats" class="tab-content active">
        <div class="dashboard-container">
            
            <div class="stat-card">
                <div class="stat-header">
                    <h3 class="stat-title">CPU Usage</h3>
                    <div class="stat-icon icon-cpu">⚙️</div>
                </div>
                <div class="progress-wrapper">
                    <div class="progress-info">
                        <span>Total Usage</span>
                        <span id="cpu-text">0%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div id="cpu-bar" class="progress-bar-fill fill-cpu" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-header">
                    <h3 class="stat-title">Memory</h3>
                    <div class="stat-icon icon-mem">🧠</div>
                </div>
                <div class="progress-wrapper">
                    <div class="progress-info">
                        <span id="mem-usage-text">0 / 0</span>
                        <span id="mem-percent-text">0%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div id="mem-bar" class="progress-bar-fill fill-mem" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <div class="stat-card" style="grid-column: 1 / -1;">
                <div class="stat-header">
                    <h3 class="stat-title">Storage Volumes</h3>
                    <div class="stat-icon icon-disk">💾</div>
                </div>
                <div id="disk-container">
                    <!-- Disk info will be injected here -->
                </div>
            </div>

            <div class="stat-card" style="grid-column: 1 / -1;">
                <div class="stat-header">
                    <h3 class="stat-title">Network I/O</h3>
                    <div class="stat-icon icon-net">🌐</div>
                </div>
                <div class="net-stats">
                    <div class="net-item">
                        <span class="net-label">Upload (Sent)</span>
                        <span class="net-value" id="net-sent-text">0 B</span>
                    </div>
                    <div class="net-item">
                        <span class="net-label">Download (Received)</span>
                        <span class="net-value" id="net-recv-text">0 B</span>
                    </div>
                    <div class="net-item">
                        <span class="net-label">Upload Speed</span>
                        <span class="net-value" id="net-sent-speed">0 B/s</span>
                    </div>
                    <div class="net-item">
                        <span class="net-label">Download Speed</span>
                        <span class="net-value" id="net-recv-speed">0 B/s</span>
                    </div>
                </div>
            </div>
            
        </div>
    </div>

    <div id="tab-logs" class="tab-content">
        {{ block.super }}
    </div>
</div>

<script>
    function switchTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.server-tab').forEach(el => el.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
    }

    function formatBytes(bytes) {
        if (bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    let lastNetStats = null;
    let lastTime = null;

    async function fetchStats() {
        try {
            const res = await fetch('/api/server-stats/');
            const data = await res.json();
            
            // CPU
            document.getElementById('cpu-bar').style.width = data.cpu + '%';
            document.getElementById('cpu-text').innerText = data.cpu + '%';
            
            // Memory
            document.getElementById('mem-bar').style.width = data.memory.percent + '%';
            document.getElementById('mem-percent-text').innerText = data.memory.percent + '%';
            document.getElementById('mem-usage-text').innerText = data.memory.text;
            
            // Disk
            const diskContainer = document.getElementById('disk-container');
            diskContainer.innerHTML = '';
            data.disk.forEach(d => {
                diskContainer.innerHTML += `
                    <div class="disk-item progress-wrapper">
                        <div class="progress-info">
                            <span>Mount: ${d.mountpoint} (${d.used} / ${d.total})</span>
                            <span>${d.percent}%</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill fill-disk" style="width: ${d.percent}%"></div>
                        </div>
                    </div>
                `;
            });

            // Network
            const now = Date.now();
            document.getElementById('net-sent-text').innerText = formatBytes(data.network.bytes_sent);
            document.getElementById('net-recv-text').innerText = formatBytes(data.network.bytes_recv);

            if (lastNetStats && lastTime) {
                const dt = (now - lastTime) / 1000;
                if (dt > 0) {
                    const sentSpeed = (data.network.bytes_sent - lastNetStats.bytes_sent) / dt;
                    const recvSpeed = (data.network.bytes_recv - lastNetStats.bytes_recv) / dt;
                    document.getElementById('net-sent-speed').innerText = formatBytes(sentSpeed) + '/s';
                    document.getElementById('net-recv-speed').innerText = formatBytes(recvSpeed) + '/s';
                }
            }

            lastNetStats = data.network;
            lastTime = now;

        } catch (e) {
            console.error('Failed to fetch stats:', e);
        }
    }

    // Initial fetch
    fetchStats();
    
    // Auto-update every 2 seconds
    setInterval(fetchStats, 2000);
</script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const cards = document.querySelectorAll('.stat-card');
    cards.forEach(card => {
        const titleEl = card.querySelector('.stat-title');
        if (titleEl) {
            const title = titleEl.innerText.toLowerCase();
            if (title.includes('cpu')) {
                card.style.cursor = 'pointer';
                card.onclick = function() { window.location.href = "{% url 'server_metric_history' 'cpu' %}"; };
            } else if (title.includes('memory')) {
                card.style.cursor = 'pointer';
                card.onclick = function() { window.location.href = "{% url 'server_metric_history' 'memory' %}"; };
            } else if (title.includes('storage') || title.includes('disk')) {
                card.style.cursor = 'pointer';
                card.onclick = function() { window.location.href = "{% url 'server_metric_history' 'disk' %}"; };
            } else if (title.includes('network')) {
                card.style.cursor = 'pointer';
                card.onclick = function() { window.location.href = "{% url 'server_metric_history' 'network' %}"; };
            }
        }
    });
});
</script>
{% endblock %}
