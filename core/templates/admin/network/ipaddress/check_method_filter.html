{% load i18n %}
<div class="form-group" style="margin-right: 15px; min-width: 250px;">
    <select id="discovery-method-select" class="form-control select2" multiple="multiple" data-placeholder="Filter by Check Methods..." style="width: 100%;">
        {% for choice in choices %}
            {% if choice.display != "All" %}
                <option value="{{ choice.display }}" {% if choice.display in spec.value %}selected{% endif %}>{{ choice.display }}</option>
            {% endif %}
        {% endfor %}
    </select>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Initialize Select2 if available (Jazzmin usually loads it)
    var $select = null;
    if (typeof jQuery !== 'undefined' && jQuery.fn.select2) {
        $select = jQuery('#discovery-method-select').select2({
            theme: 'bootstrap4',
            placeholder: "Select Check Methods...",
            allowClear: true
        });
        
        $select.on('select2:close', function (e) {
            applyMethodFilter();
        });
        $select.on('select2:unselect', function (e) {
            applyMethodFilter();
        });
    } else {
        // Fallback for native select
        document.getElementById('discovery-method-select').addEventListener('change', function() {
            applyMethodFilter();
        });
    }
    
    function applyMethodFilter() {
        var el = document.getElementById('discovery-method-select');
        var selected = [];
        if (typeof jQuery !== 'undefined' && jQuery.fn.select2) {
            selected = $select.val() || [];
        } else {
            for (var i = 0; i < el.options.length; i++) {
                if (el.options[i].selected) {
                    selected.push(el.options[i].value);
                }
            }
        }
        
        var url = new URL(window.location.href);
        if (selected.length > 0) {
            url.searchParams.set('{{ spec.parameter_name }}', selected.join(','));
        } else {
            url.searchParams.delete('{{ spec.parameter_name }}');
        }
        window.location.href = url.toString();
    }
});
</script>
