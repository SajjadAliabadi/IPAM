{% load i18n %}
<div class="form-group" style="margin-right: 15px; position: relative;">
    <div class="dropdown">
        <button class="btn btn-default" type="button" id="dropdownMenuMethodsBtn" style="background: #ffffff; border: 1px solid #ced4da; color: #495057; border-radius: 4px; padding: 4px 12px; font-size: 13px; height: 31px; display: flex; align-items: center; justify-content: space-between; min-width: 200px; cursor: pointer;">
            <span id="method-filter-btn-text">Filter Methods...</span>
            <i class="fas fa-caret-down" style="margin-left: 10px; color: #6c757d;"></i>
        </button>
        <div class="dropdown-menu shadow-sm" id="dropdownMenuMethodsContent" style="display: none; position: absolute; top: 100%; left: 0; z-index: 1000; background: white; width: 250px; padding: 10px; border-radius: 8px; border: 1px solid #e5e7eb; margin-top: 5px;">
            <div style="font-size: 12px; font-weight: 600; color: #6b7280; margin-bottom: 8px; text-transform: uppercase;">Select Methods</div>
            <div style="max-height: 200px; overflow-y: auto; margin-bottom: 10px; border: 1px solid #f3f4f6; border-radius: 4px; padding: 5px;">
                {% for choice in choices %}
                    {% if choice.display != "All" %}
                        <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #374151; cursor: pointer; margin: 0; padding: 4px 5px; border-radius: 4px; transition: background 0.2s;" onmouseover="this.style.background='#f3f4f6'" onmouseout="this.style.background='transparent'">
                            <input type="checkbox" class="method-forti-checkbox" value="{{ choice.display }}" style="cursor: pointer;">
                            <i class="fas fa-desktop" style="color: #9ca3af; font-size: 11px;"></i> {{ choice.display }}
                        </label>
                    {% endif %}
                {% endfor %}
            </div>
            <button type="button" class="btn btn-sm btn-success" onclick="applyFortiMethodFilter()" style="width: 100%; border-radius: 4px; font-weight: 600; background: #4caf50; border-color: #4caf50;">Apply</button>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var btn = document.getElementById('dropdownMenuMethodsBtn');
    var menu = document.getElementById('dropdownMenuMethodsContent');
    
    // Exact match for checked status via JS instead of substring template match
    var urlParams = new URLSearchParams(window.location.search);
    var selectedVal = urlParams.get('{{ spec.parameter_name }}');
    var selectedMethods = selectedVal ? selectedVal.split(',') : [];
    
    var allCheckboxes = document.querySelectorAll('.method-forti-checkbox');
    var checkedCount = 0;
    var firstCheckedValue = '';
    
    allCheckboxes.forEach(function(cb) {
        if (selectedMethods.includes(cb.value)) {
            cb.checked = true;
            checkedCount++;
            if (checkedCount === 1) firstCheckedValue = cb.value;
        } else {
            cb.checked = false;
        }
    });

    // Toggle menu
    btn.addEventListener('click', function(e) {
        e.stopPropagation();
        if (menu.style.display === 'none' || menu.style.display === '') {
            menu.style.display = 'block';
        } else {
            menu.style.display = 'none';
        }
    });
    
    // Close when clicking outside
    document.addEventListener('click', function(e) {
        if (!menu.contains(e.target) && e.target !== btn) {
            menu.style.display = 'none';
        }
    });

    var btnText = document.getElementById('method-filter-btn-text');
    if (checkedCount > 0) {
        if (checkedCount === 1) {
            btnText.innerHTML = '<span style="color:#059669;font-weight:600;">' + firstCheckedValue + '</span>';
        } else {
            btnText.innerHTML = '<span style="color:#059669;font-weight:600;">' + checkedCount + ' Methods Selected</span>';
        }
    }
});

function applyFortiMethodFilter() {
    var checkboxes = document.querySelectorAll('.method-forti-checkbox:checked');
    var selected = [];
    checkboxes.forEach(function(cb) {
        selected.push(cb.value);
    });
    
    var url = new URL(window.location.href);
    if (selected.length > 0) {
        url.searchParams.set('{{ spec.parameter_name }}', selected.join(','));
    } else {
        url.searchParams.delete('{{ spec.parameter_name }}');
    }
    window.location.href = url.toString();
}
</script>
